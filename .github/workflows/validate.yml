name: Validate website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: find . -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check required website files
        run: |
          test -f index.html
          test -f styles.css
          test -f game.js
          test -f i18n.js
          test -f airport-scene.js
